#
# Builds and publishes the OSS-CRS runner image to GHCR. Runs when the
# image inputs change, and on demand.
#
# The image is signed with Sigstore keyless signing and a SLSA provenance
# attestation is generated for the run and attached to the image. cosign v3
# stores both the signature and the attestation as OCI 1.1 referrers of the
# image manifest, so they travel with the image inside the registry.
name: oss-crs-image

on:
  push:
    branches:
      - main
    paths:
      - "runner.Dockerfile"
      - "entrypoint.sh"
      - ".github/workflows/oss-crs-image.yaml"
  workflow_dispatch:

permissions: {}

# One publish at a time so two runs cannot race on the :latest tag. Queue
# rather than cancel: a half-finished publish/sign must not be interrupted.
concurrency:
  group: oss-crs-image
  cancel-in-progress: false

env:
  COSIGN_VERSION: v3.1.2
  IMAGE_NAME: oss-crs-runner

jobs:
  build-and-push:
    name: Build & push oss-crs-runner
    # workflow_dispatch can target any branch; only main may publish and sign :latest.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # To sign the image with Sigstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

      - name: Build and push
        id: build
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/${IMAGE_NAME}"
          docker buildx build \
            --file runner.Dockerfile \
            --tag "${image}:latest" \
            --tag "${image}:${GITHUB_SHA}" \
            --metadata-file metadata.json \
            --push \
            .
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          echo "ref=${image}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${image}:latest and ${image}:${GITHUB_SHA} (${digest})"

      - name: Sign the image
        env:
          IMAGE_REF: ${{ steps.build.outputs.ref }}
        run: |
          set -euo pipefail
          # Keyless: the signature is bound to this workflow's OIDC identity.
          # Sign the digest, not a tag, so the signature cannot be detached
          # from the bits by moving a tag later.
          cosign sign --yes "$IMAGE_REF"

  # The provenance runs in its own job, in parallel with the build, so that the
  # build cannot alter the attestation. Everything it attests is read from
  # published state (the workflow run and the registry), never handed over from
  # the build job, which is why this job does not declare `needs`.
  provenance:
    name: Attest oss-crs-runner
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # To read the workflow run data
      packages: write # To attach the attestation to the image
      id-token: write # To sign the attestation with Sigstore
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

      - name: Generate provenance
        uses: carabiner-dev/actions/slsa/generate@d41fe10fe88deaf493ce026007da73738b9f570c # v1.3.0
        with:
          sign: "false"
          output: provenance.json
          timeout: 30m

      - name: Resolve the image digest
        id: image
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/${IMAGE_NAME}"
          # Read the digest back from the registry rather than trusting one
          # handed over by the build job.
          digest=$(docker buildx imagetools inspect "${image}:${GITHUB_SHA}" --format '{{.Manifest.Digest}}')
          echo "ref=${image}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Attesting ${image}@${digest}"

      - name: Generate the image SBOM
        id: sbom
        # Pinned to a main commit rather than a tag: sbom/image is merged but
        # no release carries it yet (v1.2.6 predates it). Move to a tag once
        # one ships.
        uses: carabiner-dev/actions/sbom/image@d41fe10fe88deaf493ce026007da73738b9f570c # v1.3.0
        with:
          # An SBOM of the built image, not of the source tree. unpack pulls
          # the digest from the registry and walks the layers.
          images: ${{ steps.image.outputs.ref }}
          format: spdx3
          output-path: sboms

      - name: Attach the SBOM to the image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          SBOM_FILES: ${{ steps.sbom.outputs.files }}
        run: |
          set -euo pipefail
          # One image in, so one SBOM out; take the first non-empty line.
          sbom=$(printf '%s\n' "$SBOM_FILES" | sed '/^[[:space:]]*$/d' | head -n1)
          [ -s "$sbom" ] || { echo "::error::No SBOM produced"; exit 1; }
          # https://spdx.dev/Document/v3 is the predicate type unpack itself
          # stamps on SPDX 3 documents; SPDX 3 is a different model from 2.x,
          # so it does not reuse the https://spdx.dev/Document type.
          cosign attest --yes \
            --predicate "$sbom" \
            --type "https://spdx.dev/Document/v3" \
            "$IMAGE_REF"

      - name: Attach the provenance attestation to the image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          # Here we need to extract the predicate from the tejolote attestation
          # as cosign will regenerate it
          jq '.predicate' provenance.json > predicate.json
          pred_type=$(jq -r '.predicateType' provenance.json)
          cosign attest --yes \
            --predicate predicate.json \
            --type "${pred_type}" \
            "$IMAGE_REF"
